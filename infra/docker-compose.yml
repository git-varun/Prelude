# Local Postgres matching .env.example's DATABASE_URL. Replaces the ad hoc
# `docker run` command used to stand up prelude_postgres during M1 (m1-backlog Q2).
#
# Usage: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: prelude_postgres
    environment:
      POSTGRES_USER: prelude
      POSTGRES_PASSWORD: prelude_dev_local
      POSTGRES_DB: prelude_dev
    ports:
      - "5434:5432"
    volumes:
      - prelude_postgres_data:/var/lib/postgresql/data
      - ../apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../apps/api/src/db/migrations/001_sessions.sql:/docker-entrypoint-initdb.d/02-sessions.sql:ro
      - ../apps/api/src/db/migrations/002_extraction_columns.sql:/docker-entrypoint-initdb.d/03-extraction-columns.sql:ro
      - ../apps/api/src/db/migrations/003_undated_facts_and_extraction_status.sql:/docker-entrypoint-initdb.d/04-undated-facts-and-extraction-status.sql:ro
      - ../apps/api/src/db/migrations/004_extraction_partial_status.sql:/docker-entrypoint-initdb.d/05-extraction-partial-status.sql:ro
      - ../apps/api/src/db/migrations/005_conflict_annotation.sql:/docker-entrypoint-initdb.d/06-conflict-annotation.sql:ro
      - ../apps/api/src/db/migrations/006_patient_demographics.sql:/docker-entrypoint-initdb.d/07-patient-demographics.sql:ro
      - ../apps/api/src/db/migrations/007_visits_unique_per_day.sql:/docker-entrypoint-initdb.d/08-visits-unique-per-day.sql:ro
      - ../apps/api/src/db/migrations/008_imaging_modality.sql:/docker-entrypoint-initdb.d/09-imaging-modality.sql:ro
      - ../apps/api/src/db/migrations/009_document_identity_and_parse_metadata.sql:/docker-entrypoint-initdb.d/10-document-identity-and-parse-metadata.sql:ro
      - ../apps/api/src/db/migrations/011_m3_extraction_tier1.sql:/docker-entrypoint-initdb.d/12-m3-extraction-tier1.sql:ro
      - ../apps/api/src/db/migrations/012_care_plan_items.sql:/docker-entrypoint-initdb.d/13-care-plan-items.sql:ro
      - ../apps/api/src/db/migrations/013_check_error_facility.sql:/docker-entrypoint-initdb.d/14-check-error-facility.sql:ro
      - ../apps/api/src/db/migrations/014_marker_pins.sql:/docker-entrypoint-initdb.d/15-marker-pins.sql:ro
      - ../apps/api/src/db/migrations/015_outside_encounters.sql:/docker-entrypoint-initdb.d/16-outside-encounters.sql:ro
      - ../apps/api/src/db/migrations/016_other_document_type.sql:/docker-entrypoint-initdb.d/17-other-document-type.sql:ro
      - ../apps/api/src/db/migrations/010_fact_spot_check.sql:/docker-entrypoint-initdb.d/11-fact-spot-check.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prelude -d prelude_dev"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  prelude_postgres_data:
